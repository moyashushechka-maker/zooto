<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Новий пароль — Zooto</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/auth.css">
<link rel="icon" href="assets/favicon.ico" sizes="any">
</head>
<body>
<div class="grain"></div>

<header class="nav">
  <div class="container">
    <a href="index.html" class="logo">
      <svg viewBox="0 0 48 48" fill="none"><path d="M24 44c-7 0-13-4.5-13-11 0-5 3-8 6-11 3-3 4-6 4-9 0-2 1.5-3.5 3-3.5s3 1.5 3 3.5c0 3 1 6 4 9 3 3 6 6 6 11 0 6.5-6 11-13 11z" fill="url(#g)"/><circle cx="10" cy="14" r="5" fill="url(#g)"/><circle cx="38" cy="14" r="5" fill="url(#g)"/><circle cx="4" cy="26" r="4" fill="url(#g)"/><circle cx="44" cy="26" r="4" fill="url(#g)"/><defs><linearGradient id="g" x1="0" y1="0" x2="48" y2="48"><stop offset="0" stop-color="#FFB020"/><stop offset=".5" stop-color="#F26B38"/><stop offset="1" stop-color="#E8383B"/></linearGradient></defs></svg>
      Zooto
    </a>
  </div>
</header>

<div class="auth-shell">
  <div class="orb-field"><div class="orb orb--1" style="opacity:.35;"></div><div class="orb orb--2" style="opacity:.3;"></div></div>

  <div class="auth-card reveal in-view">
    <div id="reset-form-wrap">
      <h1>Новий пароль</h1>
      <p class="sub">Встановіть новий пароль для свого акаунту.</p>

      <div class="auth-error" id="auth-error"></div>

      <form id="reset-form">
        <div class="field">
          <label>Новий пароль</label>
          <input type="password" id="reset-password" required minlength="6" placeholder="Мінімум 6 символів">
        </div>
        <div class="field">
          <label>Повторіть пароль</label>
          <input type="password" id="reset-password-confirm" required minlength="6" placeholder="Ще раз пароль">
        </div>
        <button class="btn btn-primary" type="submit" id="reset-submit" style="width:100%;">Зберегти пароль</button>
      </form>
    </div>

    <div class="auth-success" id="reset-success" style="display:none;">
      <div class="icon-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
      <h3 style="font-family:var(--ff-display); font-size:20px; margin-bottom:8px;">Пароль оновлено</h3>
      <p style="font-size:14.5px; opacity:.7;">Переходимо у ваш кабінет…</p>
    </div>

    <div class="auth-success" id="reset-invalid" style="display:none;">
      <div class="icon-badge" style="background:rgba(232,56,59,.12); color:var(--coral);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg></div>
      <h3 style="font-family:var(--ff-display); font-size:20px; margin-bottom:8px;">Посилання недійсне</h3>
      <p style="font-size:14.5px; opacity:.7;">Це посилання вже використали або строк його дії минув.</p>
      <a class="btn btn-ghost btn-sm" href="forgot-password.html" style="margin-top:16px;">Запросити нове</a>
    </div>
  </div>
</div>

<script type="module">
  import { supabase, showError, hideError, setLoading, friendlyAuthError } from './assets/auth-client.js';

  // supabase-js automatically exchanges the recovery token in the URL for a
  // session on load (detectSessionInUrl is on by default). We just wait for
  // the PASSWORD_RECOVERY event (or an existing session) before enabling the form.
  let ready = false;
  supabase.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && session)) ready = true;
  });
  setTimeout(async () => {
    if (ready) return;
    const { data } = await supabase.auth.getSession();
    if (!data.session){
      document.getElementById('reset-form-wrap').style.display = 'none';
      document.getElementById('reset-invalid').style.display = 'block';
    }
  }, 1200);

  document.getElementById('reset-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError();
    const password = document.getElementById('reset-password').value;
    const confirm = document.getElementById('reset-password-confirm').value;
    if (password !== confirm){ showError('Паролі не збігаються.'); return; }

    const btn = document.getElementById('reset-submit');
    setLoading(btn, true);
    const { error } = await supabase.auth.updateUser({ password });
    setLoading(btn, false);

    if (error){ showError(friendlyAuthError(error)); return; }

    document.getElementById('reset-form-wrap').style.display = 'none';
    document.getElementById('reset-success').style.display = 'block';
    setTimeout(() => window.location.href = 'account-redirect.html', 1400);
  });
</script>
</body>
</html>
