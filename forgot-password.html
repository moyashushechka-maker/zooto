<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Відновлення пароля — Zooto</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/auth.css">
<link rel="icon" href="assets/favicon.ico" sizes="any">
</head>
<body>
<div class="grain"></div>

<header class="nav">
  <div class="container">
    <a href="index.html" class="logo">
      <svg viewBox="0 0 48 48" fill="none"><path d="M24 44c-7 0-13-4.5-13-11 0-5 3-8 6-11 3-3 4-6 4-9 0-2 1.5-3.5 3-3.5s3 1.5 3 3.5c0 3 1 6 4 9 3 3 6 6 6 11 0 6.5-6 11-13 11z" fill="url(#g)"/><circle cx="10" cy="14" r="5" fill="url(#g)"/><circle cx="38" cy="14" r="5" fill="url(#g)"/><circle cx="4" cy="26" r="4" fill="url(#g)"/><circle cx="44" cy="26" r="4" fill="url(#g)"/><defs><linearGradient id="g" x1="0" y1="0" x2="48" y2="48"><stop offset="0" stop-color="#FFB020"/><stop offset=".5" stop-color="#F26B38"/><stop offset="1" stop-color="#E8383B"/></linearGradient></defs></svg>
      Zooto
    </a>
    <div class="nav-cta">
      <a class="btn btn-ghost btn-sm" href="login.html">До входу</a>
    </div>
  </div>
</header>

<div class="auth-shell">
  <div class="orb-field"><div class="orb orb--1" style="opacity:.35;"></div><div class="orb orb--2" style="opacity:.3;"></div></div>

  <div class="auth-card reveal in-view">
    <div id="forgot-form-wrap">
      <h1>Відновлення пароля</h1>
      <p class="sub">Вкажіть email — надішлемо посилання для встановлення нового пароля.</p>

      <div class="auth-error" id="auth-error"></div>

      <form id="forgot-form">
        <div class="field">
          <label>Email</label>
          <input type="email" id="forgot-email" required placeholder="you@example.com">
        </div>
        <button class="btn btn-primary" type="submit" id="forgot-submit" style="width:100%;">Надіслати посилання</button>
      </form>

      <p class="auth-foot">Згадали пароль? <a href="login.html">Увійти</a></p>
    </div>

    <div class="auth-success" id="forgot-success" style="display:none;">
      <div class="icon-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
      <h3 style="font-family:var(--ff-display); font-size:20px; margin-bottom:8px;">Перевірте пошту</h3>
      <p style="font-size:14.5px; opacity:.7;">Якщо такий email зареєстрований у Zooto, ми щойно надіслали на нього лист із посиланням для відновлення пароля.</p>
      <a class="btn btn-ghost btn-sm" href="login.html" style="margin-top:16px;">До входу</a>
    </div>
  </div>
</div>

<script type="module">
  import { supabase, showError, hideError, setLoading, friendlyAuthError } from './assets/auth-client.js';

  document.getElementById('forgot-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError();
    const email = document.getElementById('forgot-email').value.trim();
    const btn = document.getElementById('forgot-submit');
    setLoading(btn, true);

    const { error } = await supabase.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/reset-password.html'
    });

    setLoading(btn, false);

    // Always show the same success state, whether or not the email exists —
    // this avoids revealing which emails are registered.
    if (error && !/rate limit/i.test(error.message || '')){
      // fall through to success anyway for unknown-email cases; only show
      // a real error for things like rate limiting
    }
    if (error && /rate limit/i.test(error.message || '')){
      showError(friendlyAuthError(error));
      return;
    }

    document.getElementById('forgot-form-wrap').style.display = 'none';
    document.getElementById('forgot-success').style.display = 'block';
  });
</script>
</body>
</html>
