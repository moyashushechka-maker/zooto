<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Реєстрація — Zooto</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/auth.css">
<link rel="icon" href="assets/favicon.ico" sizes="any">
</head>
<body>
<div class="grain"></div>

<header class="nav">
  <div class="container">
    <a href="index.html" class="logo">
      <svg viewBox="0 0 48 48" fill="none"><path d="M24 44c-7 0-13-4.5-13-11 0-5 3-8 6-11 3-3 4-6 4-9 0-2 1.5-3.5 3-3.5s3 1.5 3 3.5c0 3 1 6 4 9 3 3 6 6 6 11 0 6.5-6 11-13 11z" fill="url(#g)"/><circle cx="10" cy="14" r="5" fill="url(#g)"/><circle cx="38" cy="14" r="5" fill="url(#g)"/><circle cx="4" cy="26" r="4" fill="url(#g)"/><circle cx="44" cy="26" r="4" fill="url(#g)"/><defs><linearGradient id="g" x1="0" y1="0" x2="48" y2="48"><stop offset="0" stop-color="#FFB020"/><stop offset=".5" stop-color="#F26B38"/><stop offset="1" stop-color="#E8383B"/></linearGradient></defs></svg>
      Zooto
    </a>
    <div class="nav-cta">
      <a class="btn btn-ghost btn-sm" href="login.html">Вже маю акаунт</a>
    </div>
  </div>
</header>

<div class="auth-shell">
  <div class="orb-field"><div class="orb orb--1" style="opacity:.35;"></div><div class="orb orb--2" style="opacity:.3;"></div></div>
  <noscript><p style="text-align:center;">Увімкніть JavaScript, щоб зареєструватися.</p></noscript>
</div>

<script type="module" src="assets/register-modal.js"></script>
<script type="module">
  // Wait a tick for register-modal.js's own DOMContentLoaded handler to inject the modal first.
  window.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
      const role = new URLSearchParams(location.search).get('role') || 'buyer';
      window.__zootoOpenRegister && window.__zootoOpenRegister(role);
    }, 30);
  });
</script>
</body>
</html>
