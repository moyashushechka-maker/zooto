<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Реєстрація — Zooto</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/auth.css">
<link rel="icon" href="assets/favicon.ico" sizes="any">
</head>
<body>
<div class="grain"></div>

<header class="nav">
  <div class="container">
    <a href="index.html" class="logo">
      <img src="assets/logo-icon.png" alt="Zooto">
      Zooto
    </a>
    <div class="nav-cta">
      <a class="btn btn-ghost btn-sm" href="login.html">Вже маю акаунт</a>
    </div>
  </div>
</header>

<div class="auth-shell">
  <div class="orb-field"><div class="orb orb--1" style="opacity:.35;"></div><div class="orb orb--2" style="opacity:.3;"></div></div>
  <noscript><p style="text-align:center;">Увімкніть JavaScript, щоб зареєструватися.</p></noscript>
</div>

<script type="module" src="assets/register-modal.js"></script>
<script type="module">
  // Wait a tick for register-modal.js's own DOMContentLoaded handler to inject the modal first.
  window.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
      const role = new URLSearchParams(location.search).get('role') || 'buyer';
      window.__zootoOpenRegister && window.__zootoOpenRegister(role);
    }, 30);
  });
</script>
</body>
</html>
