<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Реєстрація — Zooto</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/auth.css">
<link rel="icon" href="assets/favicon.ico" sizes="any">
</head>
<body>
<div class="grain"></div>

<header class="nav">
  <div class="container">
    <a href="index.html" class="logo">
      <svg viewBox="0 0 48 48" fill="none"><path d="M24 44c-7 0-13-4.5-13-11 0-5 3-8 6-11 3-3 4-6 4-9 0-2 1.5-3.5 3-3.5s3 1.5 3 3.5c0 3 1 6 4 9 3 3 6 6 6 11 0 6.5-6 11-13 11z" fill="url(#g)"/><circle cx="10" cy="14" r="5" fill="url(#g)"/><circle cx="38" cy="14" r="5" fill="url(#g)"/><circle cx="4" cy="26" r="4" fill="url(#g)"/><circle cx="44" cy="26" r="4" fill="url(#g)"/><defs><linearGradient id="g" x1="0" y1="0" x2="48" y2="48"><stop offset="0" stop-color="#FFB020"/><stop offset=".5" stop-color="#F26B38"/><stop offset="1" stop-color="#E8383B"/></linearGradient></defs></svg>
      Zooto
    </a>
    <div class="nav-cta">
      <a class="btn btn-ghost btn-sm" href="login.html">Вже маю акаунт</a>
    </div>
  </div>
</header>

<div class="auth-shell">
  <div class="orb-field"><div class="orb orb--1" style="opacity:.35;"></div><div class="orb orb--2" style="opacity:.3;"></div></div>

  <div class="auth-card reveal in-view">
    <div id="register-form-wrap">
      <h1>Створити акаунт</h1>
      <p class="sub">Оберіть, хто ви — інтерфейс одразу підлаштується під вас.</p>

      <div class="auth-error" id="auth-error"></div>

      <div class="role-switcher" data-active="0" id="role-switcher">
        <div class="role-switcher-thumb"></div>
        <button type="button" class="active" data-role="buyer">Покупець</button>
        <button type="button" data-role="breeder">Заводчик</button>
        <button type="button" data-role="shelter">Притулок</button>
      </div>

      <form id="register-form">
        <div class="field">
          <label id="name-label">Ім'я</label>
          <input type="text" id="reg-name" required placeholder="Як до вас звертатись">
        </div>
        <div class="field">
          <label>Місто</label>
          <input type="text" id="reg-city" placeholder="Необов'язково">
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" id="reg-email" required placeholder="you@example.com">
        </div>
        <div class="field">
          <label>Пароль</label>
          <input type="password" id="reg-password" required minlength="6" placeholder="Мінімум 6 символів">
        </div>
        <div class="field">
          <label>Повторіть пароль</label>
          <input type="password" id="reg-password-confirm" required minlength="6" placeholder="Ще раз пароль">
        </div>
        <button class="btn btn-primary" type="submit" id="reg-submit" style="width:100%;">Зареєструватися</button>
      </form>

      <div class="auth-divider"><span>або</span></div>

      <button class="btn-google" id="google-btn" type="button">
        <span id="google-icon"></span>
        Продовжити з Google
      </button>

      <p class="auth-foot">Вже є акаунт? <a href="login.html">Увійти</a></p>
    </div>

    <div class="auth-success" id="register-success" style="display:none;">
      <div class="icon-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
      <h3 style="font-family:var(--ff-display); font-size:20px; margin-bottom:8px;">Перевірте пошту</h3>
      <p style="font-size:14.5px; opacity:.7;">Ми надіслали лист із підтвердженням на <b id="success-email"></b>. Перейдіть за посиланням у листі, щоб активувати акаунт.</p>
      <a class="btn btn-ghost btn-sm" href="login.html" style="margin-top:16px;">До входу</a>
    </div>
  </div>
</div>

<script type="module">
  import { supabase, showError, hideError, setLoading, friendlyAuthError, GOOGLE_ICON, signInWithGoogle } from './assets/auth-client.js';

  document.getElementById('google-icon').innerHTML = GOOGLE_ICON;
  document.getElementById('google-btn').addEventListener('click', signInWithGoogle);

  const ROLE_NAME_LABEL = {
    buyer: "Ім'я",
    breeder: 'Назва розплідника',
    shelter: 'Назва притулку / ваше ім\'я'
  };
  let selectedRole = 'buyer';
  const switcher = document.getElementById('role-switcher');
  switcher.querySelectorAll('button').forEach((btn, idx) => {
    btn.addEventListener('click', () => {
      switcher.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      switcher.dataset.active = idx;
      switcher.querySelector('.role-switcher-thumb').style.transform = `translateX(${idx*100}%)`;
      selectedRole = btn.dataset.role;
      document.getElementById('name-label').textContent = ROLE_NAME_LABEL[selectedRole];
    });
  });

  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError();
    const name = document.getElementById('reg-name').value.trim();
    const city = document.getElementById('reg-city').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value;
    const confirm = document.getElementById('reg-password-confirm').value;

    if (password !== confirm){ showError('Паролі не збігаються.'); return; }

    const btn = document.getElementById('reg-submit');
    setLoading(btn, true);

    const { data, error } = await supabase.auth.signUp({
      email, password,
      options: {
        data: { role: selectedRole, display_name: name, city },
        emailRedirectTo: window.location.origin + '/login.html'
      }
    });

    setLoading(btn, false);

    if (error){ showError(friendlyAuthError(error)); return; }

    if (data.session){
      // email confirmation disabled on this project — already signed in
      window.location.href = 'account-redirect.html';
      return;
    }

    document.getElementById('success-email').textContent = email;
    document.getElementById('register-form-wrap').style.display = 'none';
    document.getElementById('register-success').style.display = 'block';
  });
</script>
</body>
</html>
