<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вхід — Zooto</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/auth.css">
<link rel="icon" href="assets/favicon.ico" sizes="any">
</head>
<body>
<div class="grain"></div>

<header class="nav">
  <div class="container">
    <a href="index.html" class="logo">
      <svg viewBox="0 0 48 48" fill="none"><path d="M24 44c-7 0-13-4.5-13-11 0-5 3-8 6-11 3-3 4-6 4-9 0-2 1.5-3.5 3-3.5s3 1.5 3 3.5c0 3 1 6 4 9 3 3 6 6 6 11 0 6.5-6 11-13 11z" fill="url(#g)"/><circle cx="10" cy="14" r="5" fill="url(#g)"/><circle cx="38" cy="14" r="5" fill="url(#g)"/><circle cx="4" cy="26" r="4" fill="url(#g)"/><circle cx="44" cy="26" r="4" fill="url(#g)"/><defs><linearGradient id="g" x1="0" y1="0" x2="48" y2="48"><stop offset="0" stop-color="#FFB020"/><stop offset=".5" stop-color="#F26B38"/><stop offset="1" stop-color="#E8383B"/></linearGradient></defs></svg>
      Zooto
    </a>
    <div class="nav-cta">
      <a class="btn btn-ghost btn-sm" href="register.html">Створити акаунт</a>
    </div>
  </div>
</header>

<div class="auth-shell">
  <div class="orb-field"><div class="orb orb--1" style="opacity:.35;"></div><div class="orb orb--2" style="opacity:.3;"></div></div>

  <div class="auth-card reveal in-view">
    <h1>З поверненням 👋</h1>
    <p class="sub">Увійдіть, щоб потрапити у свій кабінет.</p>

    <div class="auth-error" id="auth-error"></div>

    <form id="login-form">
      <div class="field">
        <label>Email</label>
        <input type="email" id="login-email" required placeholder="you@example.com">
      </div>
      <div class="field">
        <label style="display:flex; justify-content:space-between; align-items:center;">
          <span>Пароль</span>
          <a href="forgot-password.html" style="font-weight:700; color:var(--terracotta); font-size:12.5px;">Забули пароль?</a>
        </label>
        <input type="password" id="login-password" required placeholder="Ваш пароль">
      </div>
      <button class="btn btn-primary" type="submit" id="login-submit" style="width:100%;">Увійти</button>
    </form>

    <div class="auth-divider"><span>або</span></div>

    <button class="btn-google" id="google-btn" type="button">
      <span id="google-icon"></span>
      Продовжити з Google
    </button>

    <p class="auth-foot">Ще немає акаунту? <a href="register.html">Зареєструватися</a></p>
  </div>
</div>

<script type="module">
  import { supabase, showError, hideError, setLoading, friendlyAuthError, GOOGLE_ICON, signInWithGoogle } from './assets/auth-client.js';

  document.getElementById('google-icon').innerHTML = GOOGLE_ICON;
  document.getElementById('google-btn').addEventListener('click', signInWithGoogle);

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError();
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;

    const btn = document.getElementById('login-submit');
    setLoading(btn, true);

    const { error } = await supabase.auth.signInWithPassword({ email, password });

    setLoading(btn, false);

    if (error){ showError(friendlyAuthError(error)); return; }
    window.location.href = 'account-redirect.html';
  });
</script>
</body>
</html>
